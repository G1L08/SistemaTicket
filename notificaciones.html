<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones - Sistema de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --color-dar: #861f1b;
            --color-dar-hover: #6a1815;
        }

        .navbar-dark.bg-dark { background-color: #861f1b !important; }
        .navbar-dark .navbar-brand { color: #fff !important; }

        .sidebar { background-color: #f8f9fa !important; }
        .sidebar .nav-link {
            color: #000 !important;
            font-weight: 500;
            border-radius: 8px;
            margin: 2px 8px;
            transition: all 0.3s;
        }
        .sidebar .nav-link i { color: #000 !important; margin-right: 10px; }
        .sidebar .nav-link:hover { background-color: #f0e8e7 !important; color: #861f1b !important; }
        .sidebar .nav-link:hover i { color: #861f1b !important; }
        .sidebar .nav-link.active { background-color: #861f1b !important; color: #fff !important; }
        .sidebar .nav-link.active i { color: #fff !important; }
        .sidebar hr { border-color: #dee2e6; margin: 10px 15px; }

        .btn-primary {
            background-color: #861f1b !important;
            border-color: #861f1b !important;
            color: #fff !important;
        }
        .btn-primary:hover {
            background-color: #6a1815 !important;
            border-color: #6a1815 !important;
        }

        .btn-outline-primary {
            border-color: #861f1b !important;
            color: #861f1b !important;
        }
        .btn-outline-primary:hover {
            background-color: #861f1b !important;
            color: #fff !important;
        }

        .btn-secondary {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
            color: #fff !important;
        }
        .btn-secondary:hover {
            background-color: #5a6268 !important;
            border-color: #545b62 !important;
        }

        .h2 i { color: #861f1b; }

        .notif-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-left: 4px solid #861f1b;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .notif-card:hover {
            background: #f8f9fa;
            transform: translateX(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .notif-card.no-leida {
            background: #fdf5f5;
            border-left-color: #861f1b;
        }
        .notif-card.leida {
            border-left-color: #ced4da;
            opacity: 0.85;
        }
        .notif-card.leida .notif-titulo {
            font-weight: 500;
            color: #495057;
        }

        .notif-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .notif-icon.ticket_nuevo { background: #e7f1ff; color: #0d6efd; }
        .notif-icon.ticket_asignado { background: #fff3cd; color: #b8860b; }
        .notif-icon.ticket_comentario { background: #e2d9f3; color: #6f42c1; }
        .notif-icon.ticket_cerrado { background: #d4edda; color: #28a745; }
        .notif-icon.ticket_reabierto { background: #ffe5d0; color: #fd7e14; }
        .notif-icon.ticket_estado { background: #cfe2ff; color: #0d6efd; }
        .notif-icon.default { background: #e9ecef; color: #6c757d; }

        .notif-titulo { font-weight: 600; color: #212529; }
        .notif-mensaje { color: #495057; font-size: 0.95rem; margin: 4px 0; }
        .notif-meta { font-size: 0.8rem; color: #6c757d; }

        .badge-nueva {
            background: #861f1b;
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .filtro-tabs {
            background: #f8f9fa;
            padding: 4px;
            border-radius: 8px;
            display: inline-flex;
            gap: 4px;
        }
        .filtro-tabs .btn {
            border-radius: 6px !important;
            padding: 6px 16px;
            font-size: 0.9rem;
            border: none;
        }
        .filtro-tabs .btn.active {
            background: #861f1b !important;
            color: #fff !important;
        }
        .filtro-tabs .btn:not(.active) {
            background: transparent !important;
            color: #495057 !important;
        }
        .filtro-tabs .btn:not(.active):hover {
            background: #e9ecef !important;
        }

        .notif-card-nueva::after {
            content: '';
            position: absolute;
            top: 18px;
            right: 18px;
            width: 10px;
            height: 10px;
            background: #861f1b;
            border-radius: 50%;
        }
        .notif-card { position: relative; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand">
                Sistema de Tickets - DAR TI
            </span>
            <div class="d-flex align-items-center gap-2">
                <div class="position-relative">
                    <button type="button" class="btn btn-outline-light btn-sm position-relative" onclick="toggleNotificaciones()">
                        <i class="bi bi-bell"></i>
                        <span id="notificacionContador" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; display:none;">0</span>
                    </button>
                    <div id="notificacionesDropdown" class="dropdown-menu dropdown-menu-end p-0" style="width: 350px; max-height: 400px; overflow-y: auto; display:none; position: absolute; right: 0; top: 30px; z-index: 1050;">
                        <div class="p-2 bg-light border-bottom d-flex justify-content-between align-items-center">
                            <span class="fw-bold">Notificaciones</span>
                            <button class="btn btn-sm btn-link" onclick="marcarTodasLeidas()">Marcar todas como leidas</button>
                        </div>
                        <div id="listaNotificaciones" class="p-2">
                            <div class="text-center text-muted py-3">Cargando...</div>
                        </div>
                    </div>
                </div>
                <span class="text-white" id="usuarioNombre">Usuario</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesion
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mis-tickets.html">
                                <i class="bi bi-list-ul"></i> Mis tickets
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nuevo-ticket.html">
                                <i class="bi bi-plus-circle"></i> Nuevo ticket
                            </a>
                        </li>
                        <li class="nav-item" id="poolMenu" style="display:none;">
                            <hr>
                            <a class="nav-link" href="admin/pool-tickets.html">
                                <i class="bi bi-inbox"></i> Pool de tickets
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <a class="nav-link" href="admin/todos-tickets.html">
                                <i class="bi bi-grid"></i> Todos los tickets
                            </a>
                            <a class="nav-link" href="admin/usuarios.html">
                                <i class="bi bi-people"></i> Usuarios
                            </a>
                            <a class="nav-link" href="admin/dashboard-admin.html">
                                <i class="bi bi-graph-up"></i> Panel Admin
                            </a>
                        </li>
                                                <li class="nav-item">
                            <hr>
                            <a class="nav-link active" href="notificaciones.html">
                                <i class="bi bi-bell"></i> Notificaciones
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h1 class="h2 mb-0">
                        <i class="bi bi-bell"></i> Notificaciones
                    </h1>
                    <div class="d-flex align-items-center gap-2">
                        <div class="filtro-tabs">
                            <button class="btn active" id="btnFiltroTodas" onclick="cambiarFiltro('todas')">
                                Todas <span class="badge bg-secondary ms-1" id="badgeTotal">0</span>
                            </button>
                            <button class="btn" id="btnFiltroNoLeidas" onclick="cambiarFiltro('no-leidas')">
                                No leídas <span class="badge bg-danger ms-1" id="badgeNoLeidas">0</span>
                            </button>
                        </div>
                        <button class="btn btn-outline-primary btn-sm" onclick="marcarTodas()">
                            <i class="bi bi-check2-all"></i> Marcar todas como leídas
                        </button>
                    </div>
                </div>

                <div id="contenedorNotificaciones">
                    <div class="text-center py-5">
                        <div class="spinner-border" style="color: #861f1b;" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>
                </div>

                <div id="cargarMasContainer" class="text-center mb-4" style="display:none;">
                    <button class="btn btn-outline-primary" onclick="cargarMas()">
                        <i class="bi bi-arrow-down-circle"></i> Cargar más
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/notificaciones.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario) {
            window.location.href = 'index.html';
        }
        document.getElementById('usuarioNombre').textContent = usuario.nombre;

        if (usuario.roles && (usuario.roles.includes('Administrador') || usuario.roles.includes('Tecnico') || usuario.roles.includes('Técnico'))) {
            document.getElementById('poolMenu').style.display = 'block';
        }
        if (usuario.roles && usuario.roles.includes('Administrador')) {
            document.getElementById('adminMenu').style.display = 'block';
        }

        let todasLasNotificaciones = [];
        let filtroActual = 'todas';
        let limite = 20;

        const TIPOS_ICONOS = {
            'ticket_nuevo':      { icon: 'bi-plus-circle',          clase: 'ticket_nuevo' },
            'ticket_asignado':   { icon: 'bi-person-check',         clase: 'ticket_asignado' },
            'ticket_comentario': { icon: 'bi-chat-dots',            clase: 'ticket_comentario' },
            'ticket_cerrado':    { icon: 'bi-check-circle',         clase: 'ticket_cerrado' },
            'ticket_reabierto':  { icon: 'bi-arrow-counterclockwise', clase: 'ticket_reabierto' },
            'ticket_estado':     { icon: 'bi-arrow-repeat',         clase: 'ticket_estado' },
            'ticket_tomado':     { icon: 'bi-hand-index',           clase: 'ticket_asignado' },
            'ticket_prioridad':  { icon: 'bi-flag',                 clase: 'ticket_estado' },
            'ticket_vencido':    { icon: 'bi-exclamation-triangle', clase: 'ticket_reabierto' }
        };

        function escapeHTML(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function formatearFecha(fecha) {
            if (!fecha) return '';
            const d = new Date(fecha);
            return d.toLocaleString('es-MX', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function calcularTiempo(fecha) {
            if (!fecha) return '';
            const diff = Math.floor((new Date() - new Date(fecha)) / 1000);
            if (diff < 60) return 'hace ' + diff + ' seg';
            if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + ' min';
            if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + ' h';
            if (diff < 604800) return 'hace ' + Math.floor(diff / 86400) + ' días';
            return formatearFecha(fecha);
        }

        function getIcono(tipo) {
            return TIPOS_ICONOS[tipo] || { icon: 'bi-bell', clase: 'default' };
        }

        async function cargarNotificaciones(reset = true) {
            const contenedor = document.getElementById('contenedorNotificaciones');
            const btnCargarMas = document.getElementById('cargarMasContainer');

            if (reset) {
                contenedor.innerHTML = `
                    <div class="text-center py-5">
                        <div class="spinner-border" style="color: #861f1b;" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>
                `;
                btnCargarMas.style.display = 'none';
                limite = 20;
            }

            try {
                const response = await fetch('api/notificaciones/obtener.php?limite=' + limite);
                const data = await response.json();

                if (data.error) {
                    contenedor.innerHTML = `<div class="alert alert-danger">${escapeHTML(data.error)}</div>`;
                    return;
                }

                todasLasNotificaciones = Array.isArray(data) ? data : [];
                actualizarBadges();
                renderizarNotificaciones();
            } catch (error) {
                console.error('Error:', error);
                contenedor.innerHTML = `<div class="alert alert-danger">Error al cargar notificaciones: ${escapeHTML(error.message)}</div>`;
            }
        }

        function cargarMas() {
            limite += 20;
            cargarNotificaciones(false);
        }

        function cambiarFiltro(filtro) {
            filtroActual = filtro;
            document.getElementById('btnFiltroTodas').classList.toggle('active', filtro === 'todas');
            document.getElementById('btnFiltroNoLeidas').classList.toggle('active', filtro === 'no-leidas');
            renderizarNotificaciones();
        }

        function actualizarBadges() {
            const total = todasLasNotificaciones.length;
            const noLeidas = todasLasNotificaciones.filter(n => parseInt(n.Leida) === 0).length;
            document.getElementById('badgeTotal').textContent = total;
            document.getElementById('badgeNoLeidas').textContent = noLeidas;
        }

        function renderizarNotificaciones() {
            const contenedor = document.getElementById('contenedorNotificaciones');
            const btnCargarMas = document.getElementById('cargarMasContainer');

            let lista = todasLasNotificaciones;
            if (filtroActual === 'no-leidas') {
                lista = lista.filter(n => parseInt(n.Leida) === 0);
            }

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-bell-slash" style="font-size: 4rem; color: #ced4da;"></i>
                        <h5 class="mt-3 text-muted">
                            ${filtroActual === 'no-leidas' ? 'No tienes notificaciones sin leer' : 'No tienes notificaciones'}
                        </h5>
                        <p class="text-muted small">Cuando ocurra algo en tus tickets aparecerá aquí</p>
                    </div>
                `;
                btnCargarMas.style.display = 'none';
                return;
            }

            contenedor.innerHTML = lista.map(n => {
                const leida = parseInt(n.Leida) === 1;
                const icono = getIcono(n.Tipo);
                const folio = n.Folio ? escapeHTML(n.Folio) : '';
                const tituloTicket = n.Titulo ? escapeHTML(n.Titulo) : '';
                const tieneTicket = n.Id_ticket && n.Id_ticket !== null;

                return `
                    <div class="notif-card ${leida ? 'leida' : 'no-leida'}" 
                         onclick="abrirNotificacion(${n.Id_notificacion}, ${tieneTicket ? n.Id_ticket : 'null'}, ${leida})">
                        <div class="d-flex gap-3">
                            <div class="notif-icon ${icono.clase}">
                                <i class="bi ${icono.icon}"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start gap-2">
                                    <div>
                                        ${folio ? `<span class="badge bg-secondary me-1" style="font-size:0.7rem;">${folio}</span>` : ''}
                                        ${!leida ? '<span class="badge-nueva">Nueva</span>' : ''}
                                    </div>
                                    <small class="notif-meta text-nowrap" title="${formatearFecha(n.Fecha_creacion)}">
                                        <i class="bi bi-clock"></i> ${calcularTiempo(n.Fecha_creacion)}
                                    </small>
                                </div>
                                <div class="notif-titulo mt-1">
                                    ${tituloTicket || 'Notificación'}
                                </div>
                                <div class="notif-mensaje">${escapeHTML(n.Mensaje)}</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <small class="notif-meta">
                                        <i class="bi bi-calendar"></i> ${formatearFecha(n.Fecha_creacion)}
                                    </small>
                                    ${!leida ? `
                                        <button class="btn btn-sm btn-link p-0 text-decoration-none" 
                                                style="color: #861f1b; font-size: 0.85rem;"
                                                onclick="event.stopPropagation(); marcarUna(${n.Id_notificacion})">
                                            <i class="bi bi-check2"></i> Marcar como leída
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            btnCargarMas.style.display = todasLasNotificaciones.length >= limite ? 'block' : 'none';
        }

        async function marcarUna(id) {
            try {
                const response = await fetch('api/notificaciones/marcar_leida.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_notificacion: id })
                });
                const data = await response.json();
                if (data.success) {
                    const notif = todasLasNotificaciones.find(n => n.Id_notificacion == id);
                    if (notif) notif.Leida = 1;
                    actualizarBadges();
                    renderizarNotificaciones();
                    if (typeof window.actualizarContadorGlobal === 'function') {
                        window.actualizarContadorGlobal();
                    }
                } else {
                    alert('Error: ' + (data.error || 'Desconocido'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al marcar la notificación');
            }
        }

        async function marcarTodas() {
            if (!confirm('¿Marcar todas las notificaciones como leídas?')) return;

            try {
                const response = await fetch('api/notificaciones/marcar_todas.php', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    todasLasNotificaciones.forEach(n => n.Leida = 1);
                    actualizarBadges();
                    renderizarNotificaciones();
                    if (typeof window.actualizarContadorGlobal === 'function') {
                        window.actualizarContadorGlobal();
                    }
                } else {
                    alert('Error: ' + (data.error || 'Desconocido'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al marcar todas');
            }
        }

        async function abrirNotificacion(idNotif, idTicket, yaLeida) {
            if (!yaLeida) {
                try {
                    await fetch('api/notificaciones/marcar_leida.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id_notificacion: idNotif })
                    });
                    const notif = todasLasNotificaciones.find(n => n.Id_notificacion == idNotif);
                    if (notif) notif.Leida = 1;
                    actualizarBadges();
                } catch (e) {
                    console.warn('No se pudo marcar como leída:', e);
                }
            }

            if (idTicket) {
                window.location.href = 'detalle-ticket.html?id=' + idTicket;
            } else {
                renderizarNotificaciones();
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        function toggleNotificaciones() {
            const dropdown = document.getElementById('notificacionesDropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            }
        }

        function marcarTodasLeidas() {
            marcarTodas();
        }

        cargarNotificaciones();
    </script>
</body>
</html>
