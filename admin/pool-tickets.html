<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool de Tickets - Sistema de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --color-dar: #861f1b;
            --color-dar-hover: #6a1815;
        }

        .navbar-dark.bg-dark {
            background-color: #861f1b !important;
        }
        .navbar-dark .navbar-brand {
            color: #fff !important;
        }

        .sidebar {
            background-color: #f8f9fa !important;
        }
        .sidebar .nav-link {
            color: #000 !important;
            font-weight: 500;
            border-radius: 8px;
            margin: 2px 8px;
            transition: all 0.3s;
        }
        .sidebar .nav-link i {
            color: #000 !important;
            margin-right: 10px;
        }
        .sidebar .nav-link:hover {
            background-color: #f0e8e7 !important;
            color: #861f1b !important;
        }
        .sidebar .nav-link:hover i {
            color: #861f1b !important;
        }
        .sidebar .nav-link.active {
            background-color: #861f1b !important;
            color: #fff !important;
        }
        .sidebar .nav-link.active i {
            color: #fff !important;
        }
        .sidebar hr {
            border-color: #dee2e6;
            margin: 10px 15px;
        }

        .btn-outline-primary {
            border-color: #000 !important;
            color: #000 !important;
            transition: all 0.3s;
        }
        .btn-outline-primary:hover {
            background-color: #861f1b !important;
            border-color: #861f1b !important;
            color: #fff !important;
        }
        .btn-outline-primary:hover i {
            color: #fff !important;
        }

        .ticket-card {
            transition: all 0.3s;
            border-left: 4px solid #0d6efd;
        }
        .ticket-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15) !important;
        }
        .ticket-card.priority-critica { border-left-color: #dc3545; }
        .ticket-card.priority-alta { border-left-color: #fd7e14; }
        .ticket-card.priority-media { border-left-color: #ffc107; }
        .ticket-card.priority-baja { border-left-color: #28a745; }
        
        .badge-prioridad {
            font-size: 12px;
            padding: 5px 12px;
        }
        .badge-prioridad-critica { background: #dc3545; color: white; }
        .badge-prioridad-alta { background: #fd7e14; color: white; }
        .badge-prioridad-media { background: #ffc107; color: #000; }
        .badge-prioridad-baja { background: #28a745; color: white; }
        
        .filtros-pool {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .empty-pool {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-pool i {
            font-size: 4rem;
            color: #28a745;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }

        .h2 i {
            color: #861f1b;
        }

        .form-select:focus {
            border-color: #861f1b;
            box-shadow: 0 0 0 0.2rem rgba(134, 31, 27, 0.25);
        }

        .paginador-container {
            margin-top: 20px;
        }
        .paginador-container .pagination {
            margin-bottom: 0;
        }
        .paginador-container .page-link {
            color: #000;
            border-color: #dee2e6;
        }
        .paginador-container .page-link:hover {
            background-color: #f0e8e7;
            color: #861f1b;
            border-color: #861f1b;
        }
        .paginador-container .page-item.active .page-link {
            background-color: #861f1b;
            border-color: #861f1b;
            color: #fff;
        }
        .paginador-container .page-item.disabled .page-link {
            color: #6c757d;
            pointer-events: none;
            background-color: #fff;
            border-color: #dee2e6;
        }
        .info-paginacion {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">
                Pool de Tickets - DAR TI
            </span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="usuarioNombre">Usuario</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesion
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="../dashboard.html">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../mis-tickets.html">
                                <i class="bi bi-list-ul"></i> Mis tickets
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../nuevo-ticket.html">
                                <i class="bi bi-plus-circle"></i> Nuevo ticket
                            </a>
                        </li>
                        <li class="nav-item" id="poolMenu" style="display:none;">
                            <hr>
                            <a class="nav-link active" href="pool-tickets.html">
                                <i class="bi bi-inbox"></i> Pool de tickets
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <a class="nav-link" href="todos-tickets.html">
                                <i class="bi bi-grid"></i> Todos los tickets
                            </a>
                            <a class="nav-link" href="usuarios.html">
                                <i class="bi bi-people"></i> Usuarios
                            </a>
                            <a class="nav-link" href="dashboard-admin.html">
                                <i class="bi bi-graph-up"></i> Panel Admin
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-inbox"></i> Pool de tickets sin asignar
                    </h1>
                    <p class="text-muted">Haz clic en <strong>"Ver"</strong> para ver los detalles del ticket</p>
                </div>

                <div class="filtros-pool">
                    <div class="row">
                        <div class="col-md-4">
                            <select id="filtroPrioridad" class="form-select" onchange="cargarPool()">
                                <option value="">Todas las prioridades</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select id="filtroCategoria" class="form-select" onchange="cargarPool()">
                                <option value="">Todas las categorias</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-outline-primary w-100" onclick="cargarPool()">
                                <i class="bi bi-arrow-clockwise"></i> Actualizar
                            </button>
                        </div>
                    </div>
                </div>

                <div id="poolContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>
                </div>

                <div id="paginadorContainer" class="paginador-container d-flex justify-content-between align-items-center" style="display:none;">
                    <div id="infoPaginacion" class="info-paginacion"></div>
                    <nav aria-label="Navegación de páginas">
                        <ul class="pagination pagination-sm mb-0" id="paginadorLista"></ul>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario) {
            window.location.href = '../login.html';
        }
        document.getElementById('usuarioNombre').textContent = usuario.nombre;

        if (usuario.roles && (usuario.roles.includes('Tecnico') || usuario.roles.includes('Administrador'))) {
            document.getElementById('poolMenu').style.display = 'block';
        }
        if (usuario.roles && usuario.roles.includes('Administrador')) {
            document.getElementById('adminMenu').style.display = 'block';
        }

        let ticketsCompletos = [];
        let paginaActual = 1;
        const TICKETS_POR_PAGINA = 5;

        function escapeHTML(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function calcularTiempo(fecha) {
            if (!fecha) return 'No disponible';
            const diff = Math.floor((new Date() - new Date(fecha)) / 1000);
            if (diff < 60) return 'hace ' + diff + ' segundos';
            if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + ' minutos';
            if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + ' horas';
            return 'hace ' + Math.floor(diff / 86400) + ' dias';
        }

        function formatearFecha(fecha) {
            if (!fecha) return 'No disponible';
            const d = new Date(fecha);
            return d.toLocaleDateString('es-MX', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function cargarFiltros() {
            try {
                const res = await fetch('../api/prioridades/listar.php');
                const prioridades = await res.json();
                const select = document.getElementById('filtroPrioridad');
                prioridades.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.Id_prioridad;
                    option.textContent = p.Nombre;
                    select.appendChild(option);
                });

                const res2 = await fetch('../api/categorias/listar.php');
                const categorias = await res2.json();
                const select2 = document.getElementById('filtroCategoria');
                categorias.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.Id_categoria;
                    option.textContent = c.Nombre;
                    select2.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar filtros:', error);
            }
        }

        async function cargarPool() {
            const container = document.getElementById('poolContainer');
            
            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            `;
            document.getElementById('paginadorContainer').style.display = 'none';

            try {
                const prioridad = document.getElementById('filtroPrioridad').value;
                const categoria = document.getElementById('filtroCategoria').value;

                let url = '../api/tickets/pool.php';
                const params = new URLSearchParams();
                if (prioridad) params.append('prioridad', prioridad);
                if (categoria) params.append('categoria', categoria);
                if (params.toString()) url += '?' + params.toString();

                const response = await fetch(url);
                if (!response.ok) throw new Error('Error HTTP: ' + response.status);
                const tickets = await response.json();

                if (tickets.error) {
                    container.innerHTML = '<div class="alert alert-danger">' + escapeHTML(tickets.error) + '</div>';
                    return;
                }

                ticketsCompletos = tickets;
                paginaActual = 1;
                renderizarPagina();

            } catch (error) {
                console.error('Error al cargar pool:', error);
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 
                        Error al cargar los tickets: ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        function renderizarPagina() {
            const container = document.getElementById('poolContainer');
            const paginadorContainer = document.getElementById('paginadorContainer');
            const totalTickets = ticketsCompletos.length;

            if (totalTickets === 0) {
                container.innerHTML = `
                    <div class="empty-pool">
                        <i class="bi bi-check-circle pulse"></i>
                        <h4 class="mt-3">No hay tickets pendientes</h4>
                        <p class="text-muted">Todos los tickets han sido asignados</p>
                    </div>
                `;
                paginadorContainer.style.display = 'none';
                return;
            }

            const totalPaginas = Math.ceil(totalTickets / TICKETS_POR_PAGINA);
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            if (paginaActual < 1) paginaActual = 1;

            const inicio = (paginaActual - 1) * TICKETS_POR_PAGINA;
            const fin = Math.min(inicio + TICKETS_POR_PAGINA, totalTickets);
            const ticketsPagina = ticketsCompletos.slice(inicio, fin);

            container.innerHTML = ticketsPagina.map(t => {
                const prioridadClass = (t.prioridad_nombre || '').toLowerCase();
                const prioridadBadge = {
                    'critica': 'badge-prioridad-critica',
                    'alta': 'badge-prioridad-alta',
                    'media': 'badge-prioridad-media',
                    'baja': 'badge-prioridad-baja'
                }[prioridadClass] || '';

                return `
                    <div class="card shadow-sm mb-3 ticket-card priority-${prioridadClass}">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-7">
                                    <div class="d-flex align-items-center gap-2 flex-wrap">
                                        <span class="badge bg-secondary">${escapeHTML(t.Folio || 'N/A')}</span>
                                        <h5 class="mb-0">${escapeHTML(t.Titulo || 'Sin titulo')}</h5>
                                    </div>
                                    <div class="mt-2">
                                        <span class="badge badge-prioridad ${prioridadBadge}">
                                            ${escapeHTML(t.prioridad_nombre || 'Sin prioridad')}
                                        </span>
                                        <span class="badge bg-secondary">${escapeHTML(t.categoria_nombre || 'Sin categoria')}</span>
                                        <small class="text-muted ms-2">
                                            <i class="bi bi-calendar3"></i> Creado ${calcularTiempo(t.Fecha_creacion)}
                                        </small>
                                    </div>
                                    <div class="mt-1">
                                        <small class="text-muted">
                                            <i class="bi bi-person"></i> ${escapeHTML(t.usuario_nombre || '')} ${escapeHTML(t.usuario_apellido || '')}
                                        </small>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <small class="text-muted d-block">
                                        <i class="bi bi-clock-history"></i> 
                                        ${t.Fecha_vencimiento ? 'Vence: ' + formatearFecha(t.Fecha_vencimiento) : 'Sin fecha de vencimiento'}
                                    </small>
                                </div>
                                <div class="col-md-2 text-end">
                                    <a href="../detalle-ticket.html?id=${t.Id_ticket}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> Ver
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (totalPaginas > 1) {
                paginadorContainer.style.display = 'flex';
                generarPaginador(paginaActual, totalPaginas, totalTickets);
            } else {
                paginadorContainer.style.display = 'none';
            }
        }

        function generarPaginador(actual, total, totalRegistros) {
            const container = document.getElementById('paginadorLista');
            const info = document.getElementById('infoPaginacion');

            info.textContent = `Mostrando ${Math.min((actual-1)*TICKETS_POR_PAGINA+1, totalRegistros)} - ${Math.min(actual*TICKETS_POR_PAGINA, totalRegistros)} de ${totalRegistros} tickets`;

            let html = '';
            html += `<li class="page-item ${actual <= 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="cambiarPagina(${actual - 1}); return false;">Anterior</a>
                    </li>`;

            let inicio = Math.max(1, actual - 2);
            let fin = Math.min(total, actual + 2);
            
            if (actual <= 3) fin = Math.min(total, 5);
            if (actual >= total - 2) inicio = Math.max(1, total - 4);

            if (inicio > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="cambiarPagina(1); return false;">1</a></li>`;
                if (inicio > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }

            for (let i = inicio; i <= fin; i++) {
                html += `<li class="page-item ${i === actual ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="cambiarPagina(${i}); return false;">${i}</a>
                        </li>`;
            }

            if (fin < total) {
                if (fin < total - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                html += `<li class="page-item"><a class="page-link" href="#" onclick="cambiarPagina(${total}); return false;">${total}</a></li>`;
            }

            html += `<li class="page-item ${actual >= total ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="cambiarPagina(${actual + 1}); return false;">Siguiente</a>
                    </li>`;

            container.innerHTML = html;
        }

        function cambiarPagina(page) {
            const totalPaginas = Math.ceil(ticketsCompletos.length / TICKETS_POR_PAGINA);
            if (page < 1 || page > totalPaginas) return;
            paginaActual = page;
            renderizarPagina();
            document.querySelector('main').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cerrarSesion() {
            sessionStorage.removeItem('usuario');
            window.location.href = '../login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            cargarFiltros();
            cargarPool();
            setInterval(cargarPool, 60000);
        });
    </script>
</body>
<br>
</html>
