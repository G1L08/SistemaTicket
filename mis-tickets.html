<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-ticket-perforated"></i> Sistema de Tickets - DAR TI</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="usuarioNombre">Usuario</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="mis-tickets.html"><i class="bi bi-list-ul"></i> Mis tickets</a></li>
                        <li class="nav-item"><a class="nav-link" href="nuevo-ticket.html"><i class="bi bi-plus-circle"></i> Nuevo ticket</a></li>
                        <li class="nav-item"><hr></li>
                        <li class="nav-item" id="poolMenu" style="display:none;">
                            <a class="nav-link" href="admin/pool-tickets.html"><i class="bi bi-inbox"></i> Pool de tickets</a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <a class="nav-link" href="admin/todos-tickets.html"><i class="bi bi-grid"></i> Todos los tickets</a>
                            <a class="nav-link" href="admin/usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
                            <a class="nav-link" href="admin/dashboard-admin.html"><i class="bi bi-graph-up"></i> Panel Admin</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-list-ul text-primary"></i> Mis Tickets</h1>
                </div>

                <!-- Pestañas -->
                <ul class="nav nav-tabs mb-3">
                    <li class="nav-item"><a class="nav-link active" id="tabCreados" onclick="cargarTickets('creados')"><i class="bi bi-person"></i> Creados por mí</a></li>
                    <li class="nav-item" id="tabAsignadosLi" style="display:none;"><a class="nav-link" id="tabAsignados" onclick="cargarTickets('asignados')"><i class="bi bi-briefcase"></i> Asignados a mí</a></li>
                </ul>

                <div class="row mb-3">
                    <div class="col-md-3"><select id="filtroEstado" class="form-select" onchange="cargarTickets()"><option value="">Todos los estados</option></select></div>
                    <div class="col-md-3"><select id="filtroPrioridad" class="form-select" onchange="cargarTickets()"><option value="">Todas las prioridades</option></select></div>
                    <div class="col-md-3"><input type="text" id="filtroBusqueda" class="form-control" placeholder="Buscar por folio o título" onkeyup="cargarTickets()"></div>
                    <div class="col-md-3 text-end"><a href="nuevo-ticket.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo ticket</a></div>
                </div>

                <div id="ticketsContainer"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario) { window.location.href = 'login.html'; }
        document.getElementById('usuarioNombre').textContent = usuario.nombre;

        if (usuario.roles && (usuario.roles.includes('Técnico') || usuario.roles.includes('Administrador'))) {
            document.getElementById('poolMenu').style.display = 'block';
            document.getElementById('tabAsignadosLi').style.display = 'block';
        }
        if (usuario.roles && usuario.roles.includes('Administrador')) {
            document.getElementById('adminMenu').style.display = 'block';
        }

        let tipoActual = 'creados';

        function escapeHTML(t) { if (!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        function formatearFecha(f) { if(!f)return'N/A'; const d=new Date(f); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}); }

        async function cargarFiltros() {
            try {
                const res = await fetch('api/estados/listar.php');
                const estados = await res.json();
                const select = document.getElementById('filtroEstado');
                estados.forEach(e => { const o=document.createElement('option'); o.value=e.Id_estado; o.textContent=e.Nombre; select.appendChild(o); });
                const res2 = await fetch('api/prioridades/listar.php');
                const prioridades = await res2.json();
                const select2 = document.getElementById('filtroPrioridad');
                prioridades.forEach(p => { const o=document.createElement('option'); o.value=p.Id_prioridad; o.textContent=p.Nombre; select2.appendChild(o); });
            } catch(e) { console.error('Error:', e); }
        }

        async function cargarTickets(tipo) {
            if (tipo) tipoActual = tipo;
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;

            try {
                const estado = document.getElementById('filtroEstado').value;
                const prioridad = document.getElementById('filtroPrioridad').value;
                const busqueda = document.getElementById('filtroBusqueda').value.toLowerCase();

                let url = `api/tickets/listar.php?tipo=${tipoActual}`;
                if (estado) url += `&estado=${estado}`;
                if (prioridad) url += `&prioridad=${prioridad}`;

                const response = await fetch(url);
                const tickets = await response.json();
                if (tickets.error) { container.innerHTML = `<div class="alert alert-danger">${escapeHTML(tickets.error)}</div>`; return; }

                let filtrados = tickets;
                if (busqueda) {
                    filtrados = tickets.filter(t => (t.Folio && t.Folio.toLowerCase().includes(busqueda)) || (t.Titulo && t.Titulo.toLowerCase().includes(busqueda)));
                }

                if (filtrados.length === 0) {
                    const msj = tipoActual === 'asignados' ? 'No tienes tickets asignados' : 'Aún no has creado tickets';
                    container.innerHTML = `<div class="text-center py-5"><i class="bi bi-inbox" style="font-size:4rem;color:#dee2e6;"></i><h4 class="mt-3">${msj}</h4><a href="nuevo-ticket.html" class="btn btn-primary mt-2"><i class="bi bi-plus-circle"></i> Crear ticket</a></div>`;
                    return;
                }

                const prioridadColors = { 'Crítica':'danger', 'Alta':'warning', 'Media':'info', 'Baja':'secondary' };
                const estadoColors = { 'Abierto':'warning', 'En proceso':'info', 'En espera':'secondary', 'Cerrado':'success', 'Expirado':'danger' };

                container.innerHTML = filtrados.map(t => {
                    const pColor = prioridadColors[t.prioridad_nombre] || 'secondary';
                    const eColor = estadoColors[t.estado_nombre] || 'secondary';
                    const esAsignado = t.Id_tecnico_asignado == usuario.id;
                    const esCreador = t.Id_usuario == usuario.id;
                    let badge = '';
                    if (esAsignado && esCreador) badge = '<span class="badge bg-info ms-2">Creador / Técnico</span>';
                    else if (esAsignado) badge = '<span class="badge bg-primary ms-2">Asignado a mí</span>';
                    else if (esCreador) badge = '<span class="badge bg-secondary ms-2">Creado por mí</span>';

                    return `<div class="card shadow-sm mb-3"><div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <div class="d-flex align-items-center gap-2"><span class="badge bg-secondary">${escapeHTML(t.Folio)}</span>
                                <h5 class="mb-0">${escapeHTML(t.Titulo)}</h5>${badge}</div>
                                <div class="mt-2"><span class="badge bg-${eColor}">${escapeHTML(t.estado_nombre)}</span>
                                <span class="badge bg-${pColor}">${escapeHTML(t.prioridad_nombre)}</span>
                                <small class="text-muted ms-2"><i class="bi bi-calendar3"></i> ${formatearFecha(t.Fecha_creacion)}</small></div>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block"><i class="bi bi-tag"></i> ${escapeHTML(t.categoria_nombre)}</small>
                                <small class="text-muted d-block"><i class="bi bi-person"></i> ${escapeHTML(t.tecnico_nombre || 'Sin asignar')}</small>
                            </div>
                            <div class="col-md-2 text-end"><a href="detalle-ticket.html?id=${t.Id_ticket}" class="btn btn-outline-primary btn-sm"><i class="bi bi-eye"></i> Ver</a></div>
                        </div>
                    </div></div>`;
                }).join('');

            } catch(e) { console.error('Error:', e); container.innerHTML = `<div class="alert alert-danger">Error al cargar</div>`; }
        }

        document.getElementById('tabCreados').addEventListener('click', function() {
            document.getElementById('tabCreados').classList.add('active');
            document.getElementById('tabAsignados').classList.remove('active');
            cargarTickets('creados');
        });
        document.getElementById('tabAsignados').addEventListener('click', function() {
            document.getElementById('tabAsignados').classList.add('active');
            document.getElementById('tabCreados').classList.remove('active');
            cargarTickets('asignados');
        });

        function cerrarSesion() { sessionStorage.removeItem('usuario'); window.location.href = 'login.html'; }
        document.addEventListener('DOMContentLoaded', function() { cargarFiltros(); cargarTickets('creados'); });
    </script>
</body>
</html>
