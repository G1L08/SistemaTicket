<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --color-dar: #861f1b;
            --color-dar-hover: #6a1815;
        }

        .navbar-dark.bg-dark {
            background-color: #861f1b !important;
        }
        .navbar-dark .navbar-brand {
            color: #fff !important;
        }

        .sidebar {
            background-color: #f8f9fa !important;
        }
        .sidebar .nav-link {
            color: #000 !important;
            font-weight: 500;
            border-radius: 8px;
            margin: 2px 8px;
            transition: all 0.3s;
        }
        .sidebar .nav-link i {
            color: #000 !important;
            margin-right: 10px;
        }
        .sidebar .nav-link:hover {
            background-color: #f0e8e7 !important;
            color: #861f1b !important;
        }
        .sidebar .nav-link:hover i {
            color: #861f1b !important;
        }
        .sidebar .nav-link.active {
            background-color: #861f1b !important;
            color: #fff !important;
        }
        .sidebar .nav-link.active i {
            color: #fff !important;
        }
        .sidebar hr {
            border-color: #dee2e6;
            margin: 10px 15px;
        }

        .btn-outline-primary {
            border-color: #000 !important;
            color: #000 !important;
            transition: all 0.3s;
        }
        .btn-outline-primary:hover {
            background-color: #861f1b !important;
            border-color: #861f1b !important;
            color: #fff !important;
        }
        .btn-outline-primary:hover i {
            color: #fff !important;
        }

        .btn-primary {
            background-color: #861f1b !important;
            border-color: #861f1b !important;
            color: #fff !important;
        }
        .btn-primary:hover {
            background-color: #6a1815 !important;
            border-color: #6a1815 !important;
        }

        .nav-tabs .nav-link {
            color: #000 !important;
            border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .nav-tabs .nav-link:hover {
            border-color: #861f1b;
            color: #861f1b !important;
        }
        .nav-tabs .nav-link.active {
            border-color: #861f1b;
            color: #861f1b !important;
            background: transparent;
        }

        .h2 i {
            color: #861f1b;
        }

        .pagination .page-item .page-link {
            color: #000;
            border-color: #dee2e6;
            transition: all 0.3s;
        }
        .pagination .page-item .page-link:hover {
            background-color: #f0e8e7;
            color: #861f1b;
            border-color: #861f1b;
        }
        .pagination .page-item.active .page-link {
            background-color: #861f1b;
            border-color: #861f1b;
            color: #fff;
        }
        .pagination .page-item.disabled .page-link {
            color: #6c757d;
            pointer-events: none;
            background-color: #fff;
            border-color: #dee2e6;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-ticket-perforated"></i> Sistema de Tickets - DAR TI</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="usuarioNombre">Usuario</span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesion
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="mis-tickets.html">
                                <i class="bi bi-list-ul"></i> Mis tickets
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nuevo-ticket.html">
                                <i class="bi bi-plus-circle"></i> Nuevo ticket
                            </a>
                        </li>
                        <li class="nav-item" id="poolMenu" style="display:none;">
                            <hr>
                            <a class="nav-link" href="admin/pool-tickets.html">
                                <i class="bi bi-inbox"></i> Pool de tickets
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <a class="nav-link" href="admin/todos-tickets.html">
                                <i class="bi bi-grid"></i> Todos los tickets
                            </a>
                            <a class="nav-link" href="admin/usuarios.html">
                                <i class="bi bi-people"></i> Usuarios
                            </a>
                            <a class="nav-link" href="admin/dashboard-admin.html">
                                <i class="bi bi-graph-up"></i> Panel Admin
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-list-ul"></i> Mis Tickets</h1>
                </div>

                <!-- Pestañas -->
                <ul class="nav nav-tabs mb-3">
                    <li class="nav-item">
                        <a class="nav-link active" id="tabCreados" onclick="cambiarTipo('creados', 1)">
                            <i class="bi bi-person"></i> Creados por mi
                        </a>
                    </li>
                    <li class="nav-item" id="tabAsignadosLi" style="display:none;">
                        <a class="nav-link" id="tabAsignados" onclick="cambiarTipo('asignados', 1)">
                            <i class="bi bi-briefcase"></i> Asignados a mi
                        </a>
                    </li>
                </ul>

                <!-- Filtros -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <select id="filtroEstado" class="form-select" onchange="cargarTickets(1)">
                            <option value="">Todos los estados</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="filtroPrioridad" class="form-select" onchange="cargarTickets(1)">
                            <option value="">Todas las prioridades</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="filtroBusqueda" class="form-control" placeholder="Buscar por folio o titulo" onkeyup="cargarTickets(1)">
                    </div>
                    <div class="col-md-3 text-end">
                        <a href="nuevo-ticket.html" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Nuevo ticket
                        </a>
                    </div>
                </div>

                <div id="ticketsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>

                <!-- Paginador -->
                <div id="paginadorContainer" class="d-flex justify-content-between align-items-center mt-3" style="display:none;">
                    <div id="infoPaginacion" class="text-muted small"></div>
                    <nav aria-label="Navegacion de paginas">
                        <ul class="pagination pagination-sm mb-0" id="paginadorLista"></ul>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario'));
        if (!usuario) {
            window.location.href = 'login.html';
        }
        document.getElementById('usuarioNombre').textContent = usuario.nombre;

        if (usuario.roles && (usuario.roles.includes('Tecnico') || usuario.roles.includes('Administrador'))) {
            document.getElementById('poolMenu').style.display = 'block';
            document.getElementById('tabAsignadosLi').style.display = 'block';
        }
        if (usuario.roles && usuario.roles.includes('Administrador')) {
            document.getElementById('adminMenu').style.display = 'block';
        }

        let tipoActual = 'creados';
        let paginaActual = 1;
        let totalPaginas = 1;

        function escapeHTML(t) {
            if (!t) return '';
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function formatearFecha(f) {
            if (!f) return 'N/A';
            const d = new Date(f);
            return d.toLocaleDateString('es-MX', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        function cambiarTipo(tipo, page) {
            tipoActual = tipo;
            document.getElementById('tabCreados').classList.toggle('active', tipo === 'creados');
            document.getElementById('tabAsignados').classList.toggle('active', tipo === 'asignados');
            cargarTickets(page || 1);
        }

        async function cargarFiltros() {
            try {
                const res = await fetch('api/estados/listar.php');
                const estados = await res.json();
                const select = document.getElementById('filtroEstado');
                estados.forEach(e => {
                    const o = document.createElement('option');
                    o.value = e.Id_estado;
                    o.textContent = e.Nombre;
                    select.appendChild(o);
                });

                const res2 = await fetch('api/prioridades/listar.php');
                const prioridades = await res2.json();
                const select2 = document.getElementById('filtroPrioridad');
                prioridades.forEach(p => {
                    const o = document.createElement('option');
                    o.value = p.Id_prioridad;
                    o.textContent = p.Nombre;
                    select2.appendChild(o);
                });
            } catch (e) {
                console.error('Error:', e);
            }
        }

        async function cargarTickets(page = 1) {
            paginaActual = page;
            const container = document.getElementById('ticketsContainer');
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

            try {
                const estado = document.getElementById('filtroEstado').value;
                const prioridad = document.getElementById('filtroPrioridad').value;
                const busqueda = document.getElementById('filtroBusqueda').value.toLowerCase();

                let url = 'api/tickets/listar.php?tipo=' + tipoActual + '&page=' + page + '&limit=6';
                if (estado) url += '&estado=' + estado;
                if (prioridad) url += '&prioridad=' + prioridad;

                const response = await fetch(url);
                const result = await response.json();

                if (result.error) {
                    container.innerHTML = '<div class="alert alert-danger">' + escapeHTML(result.error) + '</div>';
                    document.getElementById('paginadorContainer').style.display = 'none';
                    return;
                }

                // Si no tiene paginación (array directo), no debería pasar, pero por si acaso
                let tickets = result.data || result;
                let total = result.total || tickets.length;
                totalPaginas = result.pages || 1;

                // Filtrar por búsqueda (cliente)
                if (busqueda) {
                    tickets = tickets.filter(t =>
                        (t.Folio && t.Folio.toLowerCase().includes(busqueda)) ||
                        (t.Titulo && t.Titulo.toLowerCase().includes(busqueda))
                    );
                    total = tickets.length;
                    totalPaginas = Math.ceil(total / 6);
                }

                if (tickets.length === 0) {
                    const msj = tipoActual === 'asignados' ? 'No tienes tickets asignados' : 'Aun no has creado tickets';
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox" style="font-size:4rem;color:#dee2e6;"></i>
                            <h4 class="mt-3">${msj}</h4>
                            <a href="nuevo-ticket.html" class="btn btn-primary mt-2">
                                <i class="bi bi-plus-circle"></i> Crear ticket
                            </a>
                        </div>
                    `;
                    document.getElementById('paginadorContainer').style.display = 'none';
                    return;
                }

                const prioridadColors = {
                    'Critica': 'danger',
                    'Alta': 'warning',
                    'Media': 'info',
                    'Baja': 'secondary'
                };
                const estadoColors = {
                    'Abierto': 'warning',
                    'En proceso': 'info',
                    'En espera': 'secondary',
                    'Cerrado': 'success',
                    'Expirado': 'danger'
                };

                container.innerHTML = tickets.map(t => {
                    const pColor = prioridadColors[t.prioridad_nombre] || 'secondary';
                    const eColor = estadoColors[t.estado_nombre] || 'secondary';

                    let badge = '';
                    const esAsignado = t.Id_tecnico_asignado == usuario.id;
                    const esCreador = t.Id_usuario == usuario.id;
                    if (esAsignado && esCreador) {
                        badge = '<span class="badge bg-info ms-2">Creador / Tecnico</span>';
                    } else if (esAsignado) {
                        badge = '<span class="badge bg-primary ms-2">Asignado a mi</span>';
                    } else if (esCreador) {
                        badge = '<span class="badge bg-secondary ms-2">Creado por mi</span>';
                    }

                    return `
                        <div class="card shadow-sm mb-3">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-6">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge bg-secondary">${escapeHTML(t.Folio)}</span>
                                            <h5 class="mb-0">${escapeHTML(t.Titulo)}</h5>
                                            ${badge}
                                        </div>
                                        <div class="mt-2">
                                            <span class="badge bg-${eColor}">${escapeHTML(t.estado_nombre)}</span>
                                            <span class="badge bg-${pColor}">${escapeHTML(t.prioridad_nombre)}</span>
                                            <small class="text-muted ms-2">
                                                <i class="bi bi-calendar3"></i> ${formatearFecha(t.Fecha_creacion)}
                                            </small>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <small class="text-muted d-block">
                                            <i class="bi bi-tag"></i> ${escapeHTML(t.categoria_nombre)}
                                        </small>
                                        <small class="text-muted d-block">
                                            <i class="bi bi-person"></i> ${escapeHTML(t.tecnico_nombre || 'Sin asignar')}
                                        </small>
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <a href="detalle-ticket.html?id=${t.Id_ticket}" class="btn btn-outline-primary btn-sm">
                                            <i class="bi bi-eye"></i> Ver
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Mostrar paginador si hay más de 6 tickets
                if (totalPaginas > 1) {
                    document.getElementById('paginadorContainer').style.display = 'flex';
                    generarPaginador(page, totalPaginas, total);
                } else {
                    document.getElementById('paginadorContainer').style.display = 'none';
                }

            } catch (e) {
                console.error('Error:', e);
                container.innerHTML = '<div class="alert alert-danger">Error al cargar los tickets</div>';
                document.getElementById('paginadorContainer').style.display = 'none';
            }
        }

        function generarPaginador(actual, total, totalRegistros) {
            const container = document.getElementById('paginadorLista');
            const info = document.getElementById('infoPaginacion');

            if (total <= 1) {
                container.innerHTML = '';
                info.textContent = 'Mostrando ' + totalRegistros + ' tickets';
                return;
            }

            let html = '';
            html += `<li class="page-item ${actual <= 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="cambiarPagina(${actual - 1}); return false;">Anterior</a>
                    </li>`;

            let inicio = Math.max(1, actual - 2);
            let fin = Math.min(total, actual + 2);

            if (actual <= 3) fin = Math.min(total, 5);
            if (actual >= total - 2) inicio = Math.max(1, total - 4);

            if (inicio > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="cambiarPagina(1); return false;">1</a></li>`;
                if (inicio > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }

            for (let i = inicio; i <= fin; i++) {
                html += `<li class="page-item ${i === actual ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="cambiarPagina(${i}); return false;">${i}</a>
                        </li>`;
            }

            if (fin < total) {
                if (fin < total - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                html += `<li class="page-item"><a class="page-link" href="#" onclick="cambiarPagina(${total}); return false;">${total}</a></li>`;
            }

            html += `<li class="page-item ${actual >= total ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="cambiarPagina(${actual + 1}); return false;">Siguiente</a>
                    </li>`;

            container.innerHTML = html;
            info.textContent = 'Mostrando ' + totalRegistros + ' tickets | Pagina ' + actual + ' de ' + total;
        }

        function cambiarPagina(page) {
            if (page < 1 || page > totalPaginas) return;
            cargarTickets(page);
        }

        // Revisar si los eventos de pestañas ya están configurados (se llaman desde onclick en HTML)
        // También se puede manejar con addEventListener, pero ya están en el HTML.

        function cerrarSesion() {
            sessionStorage.removeItem('usuario');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            cargarFiltros();
            cargarTickets(1);
        });
    </script>
</body>
</html>
